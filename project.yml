name: AlphaBeta
options:
  bundleIdPrefix: com.JohnHoedeman
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  AlphaBeta:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Content
      - path: UserData
      - path: Features
      - path: Theme
      - path: Support
    resources:
      - path: Content/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.JohnHoedeman.AlphaBeta
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XY62X6K9VH
    entitlements:
      path: App/AlphaBeta.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.JohnHoedeman.AlphaBeta
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  AlphaBetaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AlphaBetaTests
    dependencies:
      - target: AlphaBeta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AlphaBetaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AlphaBetaUITests
    dependencies:
      - target: AlphaBeta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlphaBeta:
    build:
      targets:
        AlphaBeta: all
        AlphaBetaTests: [test]
        AlphaBetaUITests: [test]
    test:
      targets:
        - AlphaBetaTests
        - AlphaBetaUITests
